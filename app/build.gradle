plugins {
    id 'com.android.application'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId "ru.kkuzmichev.simpleappforespresso"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.0'
    implementation 'androidx.navigation:navigation-fragment:2.3.5'
    implementation 'androidx.navigation:navigation-ui:2.3.5'

    testImplementation 'junit:junit:4.13.2'

    // Тестовые зависимости — только эти, без дублей
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:monitor:1.6.1'          // <-- важно для InputManager
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'       // <-- новая версия
    androidTestImplementation 'androidx.test:runner:1.5.2'          // <-- новая версия
    androidTestImplementation 'androidx.test:rules:1.5.0'           // <-- новая версия
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' // <-- исправленная версия
}
